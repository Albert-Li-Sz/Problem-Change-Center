name: Public platform Docker acceptance
on:
  push:
    branches: [public]
  pull_request:
    branches: [public]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-docker:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: public-ci-test-password
          POSTGRES_DB: public_test
        ports: ["5432:5432"]
        options: --health-cmd="pg_isready -U postgres" --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      PUBLIC_TEST_DATABASE_URL: postgresql://postgres:public-ci-test-password@127.0.0.1:5432/public_test
      PUBLIC_TEST_DOCKER: "1"
      PUBLIC_TEST_NATIVE_WINE: "1"
      PUBLIC_TEST_ROLES: "1"
      P2H_E2E_PYTHON: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: python -m pip install --require-hashes -r backend/requirements-public.lock
      - name: Build base and public runners
        run: |
          docker compose --profile wine build runner runner-wine
          docker build -f runner/Dockerfile.public --build-arg RUNNER_BASE=p2h-runner -t p2h-public-runner .
          docker build -f runner/Dockerfile.public --build-arg RUNNER_BASE=p2h-runner-wine -t p2h-public-runner-wine .
      - name: PostgreSQL, isolation, Wine and conversion acceptance
        run: python -m pytest backend/tests/test_public.py -q
      - name: Public browser workflow
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run test:public
      - name: Build deployment images
        run: |
          docker build -f deploy/public/Dockerfile --target api -t p2h-public-api .
          docker build -f deploy/public/Dockerfile --target worker -t p2h-public-worker .
          docker build -f deploy/public/Dockerfile.web -t p2h-public-web .
          docker run --rm -e PUBLIC_DOMAIN=localhost -e ACME_EMAIL=ci@example.org p2h-public-web caddy validate --config /etc/caddy/Caddyfile
