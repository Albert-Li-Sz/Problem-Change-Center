name: p2h-public

x-logging: &logging
  driver: json-file
  options: {max-size: 10m, max-file: "3"}

# Shared by API and Worker so admission and execution agree on every limit.
x-limits: &limits
  PUBLIC_DATA_DIR: ${PUBLIC_DATA_DIR:-/srv/p2h/data}
  PUBLIC_MAX_CONCURRENT: ${PUBLIC_MAX_CONCURRENT:-10}
  PUBLIC_MAX_WINE: ${PUBLIC_MAX_WINE:-3}
  PUBLIC_MAX_UPLOAD_MB: ${PUBLIC_MAX_UPLOAD_MB:-512}
  PUBLIC_JOB_MEMORY: ${PUBLIC_JOB_MEMORY:-4g}
  PUBLIC_WINE_MEMORY: ${PUBLIC_WINE_MEMORY:-6g}
  PUBLIC_JOB_SWAP: ${PUBLIC_JOB_SWAP:-0}
  PUBLIC_JOB_CPUS: ${PUBLIC_JOB_CPUS:-2}
  PUBLIC_WORK_SIZE: ${PUBLIC_WORK_SIZE:-2g}
  PUBLIC_OUTPUT_SIZE: ${PUBLIC_OUTPUT_SIZE:-1g}
  PUBLIC_HOME_SIZE: ${PUBLIC_HOME_SIZE:-1g}
  PUBLIC_WINE_HOME_SIZE: ${PUBLIC_WINE_HOME_SIZE:-2g}

x-app: &app
  image: ${PUBLIC_API_IMAGE:-p2h-public-api}
  build:
    context: .
    dockerfile: deploy/public/Dockerfile
    target: api
    args: &python-build
      PIP_INDEX_URL: ${PUBLIC_PIP_INDEX_URL:-https://pypi.org/simple}
      APT_MIRROR: ${P2H_APT_MIRROR:-}
  restart: unless-stopped
  init: true
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: ["/tmp:size=2g,mode=1777"]
  volumes:
    # Same absolute path is required inside Worker and on the Docker host.
    - ${PUBLIC_DATA_DIR:-/srv/p2h/data}:${PUBLIC_DATA_DIR:-/srv/p2h/data}
  networks: [database]
  logging: *logging

services:
  postgres:
    image: postgres:17-alpine@sha256:e5d2edd28b1f8d40a0a6c0c9cdc545b19b56a0d5d88f94bc11a97d970d4700d0
    restart: unless-stopped
    init: true
    read_only: true
    # The entrypoint starts as root to fix volume ownership, then drops to postgres.
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp, /var/run/postgresql]
    shm_size: 128m
    logging: *logging
    environment:
      POSTGRES_DB: p2h
      POSTGRES_USER: p2h_owner
      POSTGRES_PASSWORD: ${PUBLIC_OWNER_DB_PASSWORD:?Run ./public.sh install first}
    volumes: [postgres_data:/var/lib/postgresql/data]
    networks: [database]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U p2h_owner -d p2h"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: ${PUBLIC_POSTGRES_MEMORY:-2g}

  migrate:
    <<: *app
    restart: "no"
    command: [python, -m, app.public.cli, provision]
    environment:
      PUBLIC_DATABASE_URL: postgresql://p2h_owner:${PUBLIC_OWNER_DB_PASSWORD}@postgres:5432/p2h
      PUBLIC_API_DB_PASSWORD: ${PUBLIC_API_DB_PASSWORD:?Generate public configuration}
      PUBLIC_WORKER_DB_PASSWORD: ${PUBLIC_WORKER_DB_PASSWORD:?Generate public configuration}
    depends_on:
      postgres: {condition: service_healthy}

  api:
    <<: *app
    environment:
      <<: *limits
      PUBLIC_DATABASE_URL: postgresql://p2h_api:${PUBLIC_API_DB_PASSWORD}@postgres:5432/p2h
      PUBLIC_ORIGIN: https://${PUBLIC_DOMAIN:?Set PUBLIC_DOMAIN}
      PUBLIC_API_WORKERS: ${PUBLIC_API_WORKERS:-2}
      # turnstile, or off to rely on the proxy's proof-of-work and rate limits.
      PUBLIC_CAPTCHA: ${PUBLIC_CAPTCHA:-turnstile}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      SMTP_HOST: ${SMTP_HOST:?Set SMTP host}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:?Set SMTP sender}
      PUBLIC_CONTACT_EMAIL: ${PUBLIC_CONTACT_EMAIL:?Set operator contact}
    depends_on:
      migrate: {condition: service_completed_successfully}
    networks: [database, edge]
    mem_limit: ${PUBLIC_API_MEMORY:-3g}
    cpus: 2
    pids_limit: 256
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/live',timeout=5)"]
      interval: 20s
      timeout: 10s
      retries: 3

  worker:
    <<: *app
    image: ${PUBLIC_WORKER_IMAGE:-p2h-public-worker}
    build:
      context: .
      dockerfile: deploy/public/Dockerfile
      target: worker
      args: *python-build
    command: [python, -m, app.public.worker]
    environment:
      <<: *limits
      PUBLIC_DATABASE_URL: postgresql://p2h_worker:${PUBLIC_WORKER_DB_PASSWORD}@postgres:5432/p2h
      # runc by default; runsc (gVisor) adds a user-space kernel if installed.
      PUBLIC_RUNNER_RUNTIME: ${PUBLIC_RUNNER_RUNTIME:-runc}
      PUBLIC_RUNNER_IMAGE: ${PUBLIC_RUNNER_IMAGE:-p2h-public-runner}
      PUBLIC_WINE_IMAGE: ${PUBLIC_WINE_IMAGE:-p2h-public-runner-wine}
    group_add: ["${DOCKER_GID:-0}"]
    volumes:
      - ${PUBLIC_DATA_DIR:-/srv/p2h/data}:${PUBLIC_DATA_DIR:-/srv/p2h/data}
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      migrate: {condition: service_completed_successfully}
    stop_grace_period: 45s
    mem_limit: ${PUBLIC_WORKER_MEMORY:-4g}
    cpus: 2
    pids_limit: 512

  caddy:
    image: ${PUBLIC_WEB_IMAGE:-p2h-public-web}
    build:
      context: .
      dockerfile: deploy/public/Dockerfile.web
      args:
        NPM_CONFIG_REGISTRY: ${PUBLIC_NPM_REGISTRY:-https://registry.npmjs.org/}
        GOPROXY: ${PUBLIC_GOPROXY:-https://proxy.golang.org,direct}
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    logging: *logging
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN}
      ACME_EMAIL: ${PUBLIC_CONTACT_EMAIL}
      # Upload limit plus multipart overhead; keep in step with PUBLIC_MAX_UPLOAD_MB.
      PUBLIC_MAX_BODY: ${PUBLIC_MAX_BODY:-528MiB}
      # Space-separated CIDRs allowed to reach /api/admin/*; default is everyone.
      PUBLIC_ADMIN_ALLOW: ${PUBLIC_ADMIN_ALLOW:-0.0.0.0/0 ::/0}
      CERBERUS_DIFFICULTY: ${CERBERUS_DIFFICULTY:-10}
      CERBERUS_BLOCK_TTL: ${CERBERUS_BLOCK_TTL:-1h}
    volumes: [caddy_data:/data, caddy_config:/config]
    networks:
      edge: {ipv4_address: 172.30.0.2}
    depends_on:
      api: {condition: service_healthy}
    mem_limit: ${PUBLIC_CADDY_MEMORY:-512m}

  runner:
    profiles: [build-runners]
    image: ${PUBLIC_RUNNER_IMAGE:-p2h-public-runner}
    build:
      context: .
      dockerfile: runner/Dockerfile.public
      args: {RUNNER_BASE: "${P2H_RUNNER_BASE:-p2h-runner}"}

  runner-wine:
    profiles: [build-runners]
    platform: linux/amd64
    image: ${PUBLIC_WINE_IMAGE:-p2h-public-runner-wine}
    build:
      context: .
      dockerfile: runner/Dockerfile.public
      args: {RUNNER_BASE: "${P2H_WINE_BASE:-p2h-runner-wine}"}

networks:
  database: {internal: true}
  edge:
    ipam:
      # Dynamic addresses come from the upper half, so the API can never take
      # the fixed address that it trusts as the proxy.
      config: [{subnet: 172.30.0.0/24, ip_range: 172.30.0.128/25}]
volumes:
  postgres_data:
  caddy_data:
  caddy_config:
